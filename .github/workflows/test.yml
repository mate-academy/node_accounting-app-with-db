name: Test

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234 # 👈 Changed to match your local .env
          POSTGRES_DB: accounting_app # 👈 Changed to match your local .env
          POSTGRES_PORT: 5432
          POSTGRES_HOST: localhost
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        env:
          PGUSER: postgres
          PGPASSWORD: 1234
          PGDATABASE: accounting_app
          PGHOST: localhost
          PGPORT: 5432
        run: npm test
