jobs:
  build:
    runs-on: ubuntu-latest

    # Make DB creds available to all steps
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accounting_app
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: accounting_app
      DB_HOST: postgres        # use service hostname
      DB_PORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: accounting_app
      PGHOST: postgres
      PGPORT: 5432

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run lint
        run: npm run lint
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h $PGHOST -p $PGPORT -U $PGUSER && break
            sleep 1
          done
      - name: Run category tests
        run: npx jest tests/category.test.js --verbose --forceExit
